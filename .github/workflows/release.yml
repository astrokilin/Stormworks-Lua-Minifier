on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --noupx -n Stormworks-Lua-Minifier src\main.py

      - name: Prepare release files
        run: |
          mkdir release
          move dist\Stormworks-Lua-Minifier.exe release\Stormworks-Lua-Minifier.exe

      - name: Generate SHA256
        run: |
          certutil -hashfile release\Stormworks-Lua-Minifier.exe SHA256 > release\SHA256SUM.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary
        run: |
          cosign sign-blob `
            --yes `
            --output-signature release\Stormworks-Lua-Minifier.exe.sig `
            release\Stormworks-Lua-Minifier.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Stormworks-Lua-Minifier.exe
            release/Stormworks-Lua-Minifier.exe.sig
            release/SHA256SUM.txt

